[project]
name = "qgchannel"
version = "0.1.0"
description = "A multi-level quasi-geostrophic channel with its own storms, for imposed-stratosphere experiments"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
scripts = ["pandas>=2.1", "xarray>=2023.10", "netCDF4", "matplotlib>=3.8"]
observations = ["pandas>=2.1", "pyarrow>=14", "requests>=2.31"]
wcb = ["pandas>=2.1", "xarray>=2023.10", "zarr>=2.16,<3", "gcsfs>=2023.10", "h5py>=3.9", "pyshtools>=4.10", "netCDF4"]
dev = ["pytest>=8", "ruff==0.17.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qgchannel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
